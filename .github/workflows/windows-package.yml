name: Windows package

on:
  workflow_dispatch:
  push:
    branches: ["main", "codex/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt pytest httpx
      - run: npm run test:api
      - run: npm run test:desktop
      - name: Build graphical bare-metal installer
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            /DOUTPUT_DIR=..\..\release `
            installer\windows-bootstrap\VoiceBridgeBareMetal.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
      - name: Package Windows application
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run package:win
      - name: Publish Windows update
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Attach bare-metal installer assets to release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: powershell
        run: |
          Copy-Item scripts\install-windows-local-gpu.ps1 `
            release\VoiceBridge-Windows-Install-Logic.ps1
          gh release upload $env:GITHUB_REF_NAME `
            release\VoiceBridge-Windows-Install-Logic.ps1 `
            release\VoiceBridge-Studio-GPU-OneClick-Setup-0.6.0.exe `
            --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBridge-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/VoiceBridge-Windows-Install-Logic.ps1
          if-no-files-found: error
