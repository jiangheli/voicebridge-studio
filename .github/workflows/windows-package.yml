name: Windows package

on:
  workflow_dispatch:
  push:
    branches: ["main", "codex/**"]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -r server/requirements.txt pytest httpx
      - run: npm run test:api
      - run: npm run test:desktop
      - name: Build graphical bare-metal installer
        shell: powershell
        run: |
          choco install nsis --yes --no-progress
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            /DOUTPUT_DIR=..\..\release `
            installer\windows-bootstrap\VoiceBridgeBareMetal.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }
      - name: Package Windows application
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: npm run package:win
      - name: Build Windows update
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: npm run release:win
      - name: Publish verified update assets
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        shell: powershell
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $installer = "release\VoiceBridge-Studio-$version-Windows-x64.exe"
          $blockmap = "$installer.blockmap"
          $metadata = "release\latest.yml"
          $bootstrap = "release\VoiceBridge-Studio-GPU-OneClick-Setup-$version.exe"
          foreach ($required in @($installer, $blockmap, $metadata, $bootstrap)) {
            if (-not (Test-Path -LiteralPath $required -PathType Leaf)) {
              throw "Missing update asset: $required"
            }
          }
          Copy-Item scripts\install-windows-local-gpu.ps1 `
            release\VoiceBridge-Windows-Install-Logic.ps1
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME `
              --title "VoiceBridge Studio $env:GITHUB_REF_NAME" `
              --generate-notes
          }
          gh release upload $env:GITHUB_REF_NAME `
            $installer `
            $blockmap `
            $metadata `
            release\VoiceBridge-Windows-Install-Logic.ps1 `
            $bootstrap `
            --clobber
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release upload failed"
          }
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBridge-Windows
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
            release/VoiceBridge-Windows-Install-Logic.ps1
          if-no-files-found: error
