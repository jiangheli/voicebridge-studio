name: Windows bare-metal installer

on:
  workflow_dispatch:
  push:
    branches: ["main", "codex/**"]
    paths:
      - "scripts/install-windows-local-gpu.ps1"
      - "installer/windows-bootstrap/**"
      - ".github/workflows/windows-bootstrap-installer.yml"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install NSIS
        shell: powershell
        run: choco install nsis --yes --no-progress

      - name: Build graphical bootstrap installer
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null
          & "${env:ProgramFiles(x86)}\NSIS\makensis.exe" `
            /DOUTPUT_DIR=..\..\release `
            installer\windows-bootstrap\VoiceBridgeBareMetal.nsi
          if ($LASTEXITCODE -ne 0) {
            throw "makensis failed with exit code $LASTEXITCODE"
          }

      - name: Verify installer exists
        shell: powershell
        run: |
          $installer = Get-Item release\VoiceBridge-Studio-GPU-OneClick-Setup-0.5.1.exe
          $hash = Get-FileHash $installer.FullName -Algorithm SHA256
          Write-Host "$($installer.Name) $($installer.Length) bytes"
          Write-Host "SHA256 $($hash.Hash)"

      - uses: actions/upload-artifact@v4
        with:
          name: VoiceBridge-GPU-OneClick-Setup
          path: release/VoiceBridge-Studio-GPU-OneClick-Setup-0.5.1.exe
          if-no-files-found: error
